*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:var(--pat);color:var(--ink);font:500 17px/1.55 Nunito,system-ui,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
h1,h2,h3{margin:0;line-height:1.2;font-family:Lora,Georgia,serif;font-weight:700}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.band{height:28px;background:var(--orn) repeat-x center/auto 28px;border-radius:4px;border:1px solid var(--gold)}
.btn{border:0;border-bottom:5px solid rgba(0,0,0,.28);border-radius:10px;padding:12px 22px;font-weight:900;background:var(--gold);color:#3a2a00}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.sky{background:var(--sky);color:#fff}.btn.grass{background:var(--grass);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card{position:relative;overflow:hidden;background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:34px 22px 22px;box-shadow:0 4px 0 rgba(11,58,92,.18)}
.card::before{content:'';position:absolute;left:0;right:0;top:0;height:14px;background:var(--orn) repeat-x center/auto 14px}
.login{position:relative;overflow:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 14% 16%,#f4c542 0 6%,transparent 6.3%),linear-gradient(#8fd6dc 56%,#d8c986 56%)}
.login::after{content:'';position:absolute;left:0;right:0;top:56%;height:34px;transform:translateY(-50%);background:var(--orn) repeat-x center/auto 34px;border-block:2px solid var(--gold)}
.login .card{position:relative;z-index:2;max-width:460px;width:100%;text-align:center;padding:40px 26px 30px;border:5px double var(--gold)}
.login h1{font-size:clamp(2.2rem,9vw,3.2rem);color:var(--navy);margin:6px 0}
.login input{width:100%;padding:14px;border:3px solid var(--gold);border-radius:10px;font:900 1.2rem Nunito,sans-serif;text-align:center;background:var(--bg);color:var(--ink);margin:16px 0}
.lang{display:inline-flex;border:2px solid var(--gold);border-radius:10px;overflow:hidden}
.lang button{border:0;background:none;padding:6px 14px;font-weight:900}
.lang button.on{background:var(--gold);color:#3a2a00}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:linear-gradient(120deg,#0b3a5c,#0f6a82);color:#fff}
.top .lang button{color:#fff}.top .lang button.on{color:#3a2a00}
.who{display:flex;align-items:center;gap:10px;font-weight:900}
.bar{flex:1;min-width:200px}
.bar .lbl{display:flex;justify-content:space-between;font-weight:900;font-size:.9rem;margin-bottom:4px}
.track{height:18px;border-radius:99px;background:#082a44;overflow:hidden;border:2px solid var(--gold)}
.fill{height:100%;background:linear-gradient(90deg,#f2c14e,#e3a72f);transition:width .8s}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:16px 0}
.tabs button{flex:0 0 auto;border:2px solid var(--gold);background:var(--card);border-radius:10px;padding:10px 18px;font-weight:900}
.tabs button.on{background:var(--navy);color:var(--gold)}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#0b3a5c,#0f7a8f);color:#fff;border:3px solid var(--gold);border-radius:16px;padding:26px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero::after{content:'';position:absolute;right:-50px;top:-60px;width:280px;height:280px;background:var(--shy) center/contain no-repeat;opacity:.3;animation:spin 80s linear infinite;pointer-events:none}
.hero>*{position:relative;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h2{font-size:clamp(1.6rem,5vw,2.4rem);margin-bottom:8px;color:#f6d77a}
.hero p{margin:0;max-width:460px;opacity:.95}
.dip{width:100%;margin:16px 0;display:flex;gap:16px;align-items:center;text-align:left;padding:18px 22px;border-radius:14px;border:3px solid #8a5d0a;border-bottom-width:8px;background:linear-gradient(#f2c14e,#e3a72f);color:#3a2a00}
.dip:disabled{background:var(--card);color:var(--mute);border:2px dashed var(--gold);cursor:not-allowed}
.dip b{font-size:1.5rem;display:block;font-family:Lora,Georgia,serif}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.game{position:relative;overflow:hidden;border:0;border-bottom:8px solid rgba(0,0,0,.3);border-radius:14px;padding:38px 20px 24px;color:#fff;text-align:center;box-shadow:inset 0 0 0 3px rgba(243,193,78,.7)}
.game::before{content:'';position:absolute;left:0;right:0;top:0;height:16px;background:var(--orn) repeat-x center/auto 16px}
.game .ic{font-size:3.4rem}
.game b{display:block;font-size:1.5rem;margin:6px 0;font-family:Lora,Georgia,serif}
.game small{display:inline-block;background:rgba(0,0,0,.28);border-radius:6px;padding:3px 12px;font-weight:700}
.tip p{margin:10px 0 0;max-width:70ch}
.tip h3{display:flex;gap:10px;align-items:center}
.ranks{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:14px}
.rank{display:flex;gap:14px;align-items:center;border-radius:12px;padding:16px;border:3px double var(--line);background:var(--card)}
.rank.ok{background:var(--goldl);border-color:var(--gold)}
.rank:not(.ok){opacity:.6}
.rank .ic{font-size:2.2rem}
.gh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 18px}
.pill{background:var(--card);border:2px solid var(--gold);border-radius:8px;padding:6px 16px;font-weight:900}
.pill.gold{background:var(--gold);color:#3a2a00}
.item{text-align:center;font-size:6rem;margin:10px 0;transition:.3s}
.item.ok{transform:translateY(-40px) scale(1.2);opacity:0}
.item.bad{filter:hue-rotate(300deg)}
.item small{display:block;font:900 1.3rem Nunito,sans-serif}
.bins{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.bin{border:0;border-bottom:6px solid rgba(0,0,0,.3);border-radius:12px;padding:14px 6px;background:var(--sky);color:#fff;font-weight:900;box-shadow:inset 0 0 0 2px rgba(243,193,78,.7)}
.bin span{display:block;font-size:2rem}
.opt{display:block;width:100%;text-align:left;margin:10px 0;padding:14px 18px;border-radius:10px;border:3px solid var(--line);background:var(--card);font-weight:800;font-size:1.1rem}
.opt.ok{background:var(--grass);border-color:var(--grass);color:#fff}
.opt.no{background:var(--red);border-color:var(--red);color:#fff}
.fact{background:var(--skyl);border-left:6px solid var(--sky);border-radius:8px;padding:14px 18px;margin:14px 0;font-weight:700}
.field{position:relative;height:60vh;min-height:320px;border-radius:14px;background:linear-gradient(#9bdde3 0 22%,#cdbd78 22%);overflow:hidden;border:4px solid var(--gold)}
.trash{position:absolute;font-size:3rem;border:0;background:none;padding:0;transition:transform .15s}
.trash:hover{transform:scale(1.2)}
.center{text-align:center}.center h2{font-size:2.2rem;margin:10px 0}
.tg{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.mem{display:grid;gap:10px;grid-template-columns:repeat(4,1fr);max-width:520px;margin:0 auto}
.mc{aspect-ratio:1;border:0;border-bottom:5px solid rgba(0,0,0,.3);border-radius:10px;font-size:2rem;background:var(--sky);color:#fff;box-shadow:inset 0 0 0 2px rgba(243,193,78,.7)}
.mc.o{background:var(--card);border:2px solid var(--gold)}.mc.m{background:var(--goldl);border:2px solid var(--grass)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf{position:relative;height:clamp(440px,72vh,580px);margin-top:14px;border-radius:14px;background:var(--grassl);background-image:var(--pat);border:3px double var(--gold);overflow:hidden;touch-action:none}
.cb{position:absolute;width:40%;height:25%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;color:#fff;font-weight:900;font-size:1.05rem;border-bottom:6px solid rgba(0,0,0,.3);box-shadow:inset 0 0 0 3px rgba(243,193,78,.75);transition:transform .15s}
.cb.hot{outline:4px solid var(--gold);transform:scale(1.05)}
.ti{position:absolute;transform:translate(-50%,-50%);width:78px;text-align:center;touch-action:none;cursor:grab;user-select:none;z-index:5}
.ti span{display:block;font-size:2.6rem;line-height:1.1}.ti small{display:block;font-weight:800;font-size:.68rem;line-height:1.1;color:var(--ink)}
.ti.drag{z-index:50;cursor:grabbing;transition:none}.ti.bad{animation:shk .4s}
@keyframes shk{25%{margin-left:-12px}75%{margin-left:12px}}
.diploma{background:#fffaf0;color:#0b3a5c;border:14px solid #0b3a5c;outline:5px double #d9a521;outline-offset:-26px;padding:78px 24px 70px;text-align:center;max-width:900px;margin:0 auto;position:relative}
.diploma::before,.diploma::after{content:'';position:absolute;left:34px;right:34px;height:28px;background:var(--orn) repeat-x center/auto 28px;border:1px solid #d9a521}
.diploma::before{top:34px}.diploma::after{bottom:34px}
.diploma h1{font:700 clamp(2.6rem,10vw,5rem)/1 Lora,Georgia,serif;letter-spacing:.06em;text-transform:uppercase;margin:10px 0}
.diploma .nm{font:700 clamp(2rem,7vw,3.4rem) Lora,Georgia,serif;color:#b8862a;border-bottom:4px dashed #9fd0e6;display:inline-block;padding:0 24px;margin:12px 0 18px}
.diploma .rk{display:inline-block;background:#e3f3fb;border:4px double #d9a521;border-radius:10px;padding:12px 30px;font-size:1.8rem;font-weight:900;margin:14px 0}
.diploma .ft{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:22px;text-align:left}
.stamp{border:4px double var(--red);color:var(--red);border-radius:50%;width:110px;height:110px;display:flex;align-items:center;justify-content:center;font-weight:900;transform:rotate(-12deg);text-align:center;line-height:1.1}
.sig{border-top:3px solid #0b3a5c;padding-top:6px;min-width:200px;text-align:center;font-style:italic}
@media print{body *{visibility:hidden}.diploma,.diploma *{visibility:visible}.diploma{position:absolute;left:0;top:0;width:100%}.np{display:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const binAt=e=>{const n=document.elementsFromPoint(e.clientX,e.clientY).find(n=>n.classList&&n.classList.contains('cb'));return n?n.dataset.b:null};
function dragStart(e,i){const el=e.currentTarget,sx=e.clientX,sy=e.clientY,o=TH.items[i],th=TH;el.setPointerCapture(e.pointerId);el.classList.add('drag');

INIT.sort=i=>({lv:i,i:0,fb:null,bad:0,got:0,list:shuffle(SI.slice(i*6,i*6+6).map((q,k)=>[...q,i*6+k]))});

function mkpdf(jpg,w,h){const pw=842,ph=595,enc=new TextEncoder(),parts=[],off=[];let len=0;
  const push=d=>{const u=typeof d=='string'?enc.encode(d):d;parts.push(u);len+=u.length};
  const obj=(n,b)=>{off[n]=len;push(`${n} 0 obj\n${b}\nendobj\n`)};
  push('%PDF-1.4\n');
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');obj(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');
  obj(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw} ${ph}]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>`);
  off[4]=len;push(`4 0 obj\n<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>\nstream\n`);push(jpg);push('\nendstream\nendobj\n');
  const cs=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;obj(5,`<</Length ${cs.length}>>\nstream\n${cs}\nendstream`);
  const xr=len;let x='xref\n0 6\n0000000000 65535 f \n';for(let i=1;i<6;i++)x+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  push(x+`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'})}
async function drawDiploma(){const x=t(),W=1754,H=1240,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');

  g.fillStyle='#fffaf0';g.fillRect(0,0,W,H);
  g.strokeStyle='#0b3a5c';g.lineWidth=36;g.strokeRect(28,28,W-56,H-56);
  g.strokeStyle='#d9a521';g.lineWidth=4;g.strokeRect(62,62,W-124,H-124);g.strokeRect(74,74,W-148,H-148);
  const band=(y,h)=>{g.save();g.beginPath();g.rect(100,y,W-200,h);g.clip();const sc=h/32,tw=60*sc;for(let q=100;q<W-100;q+=tw){g.save();g.translate(q,y);g.scale(sc,sc);g.fillStyle='#0b4a6a';g.fillRect(0,0,60,32);g.strokeStyle='#e3a72f';g.lineWidth=2.2;g.lineCap='round';HORN.forEach(d=>g.stroke(new Path2D(d)));g.fillStyle='#e3a72f';g.fill(new Path2D(DIA));g.restore()}g.restore();g.strokeStyle='#e3a72f';g.lineWidth=2;g.strokeRect(100,y,W-200,h)};
  band(88,34);band(1126,34);
  g.textAlign='center';g.textBaseline='alphabetic';
  tx(x.app.toUpperCase(),185,'900 40px Nunito, sans-serif','#2f8f52','12px');
  tx(x.diploma.toUpperCase(),360,'900 140px Georgia, serif','#0b3a4f','10px');
  tx(x.awarded.toUpperCase(),450,'900 34px Nunito, sans-serif','#5b7480','8px');
  let fs=100;const nm=S.name;g.font=`900 ${fs}px Georgia, serif`;while(g.measureText(nm).width>W-420&&fs>40){fs-=4;g.font=`900 ${fs}px Georgia, serif`}
  const nw=g.measureText(nm).width;tx(nm,580,`900 ${fs}px Georgia, serif`,'#b8862a');
  g.setLineDash([16,10]);g.strokeStyle='#9fd0e6';g.lineWidth=6;g.beginPath();g.moveTo(W/2-nw/2-30,610);g.lineTo(W/2+nw/2+30,610);g.stroke();g.setLineDash([]);
  const words=`${x.dtext} «${x.app}».`.split(' ');let line='',y=690;g.font='700 36px Nunito, sans-serif';

  tx(line,y,'700 36px Nunito, sans-serif','#0b3a4f');
  g.fillStyle='#e3f3fb';g.strokeStyle='#bfe0ef';g.lineWidth=6;g.beginPath();g.roundRect(W/2-270,800,540,140,36);g.fill();g.stroke();
  tx(x.rl,845,'900 26px Nunito, sans-serif','#2b93c9');tx(x.rank,915,'900 66px Nunito, sans-serif','#0b3a4f');
  g.textAlign='left';g.font='700 28px Nunito, sans-serif';g.fillStyle='#5b7480';g.fillText(x.fs,190,1010);g.font='900 96px Nunito, sans-serif';g.fillStyle='#b8862a';g.fillText(String(Math.floor(S.score)),190,1100);
  g.textAlign='center';g.strokeStyle='#0b3a4f';g.lineWidth=4;g.beginPath();g.moveTo(W-580,1085);g.lineTo(W-190,1085);g.stroke();
  g.font='italic 700 30px Nunito, sans-serif';g.fillStyle='#5b7480';g.fillText(x.sign,W-385,1118);

  g.fillStyle='#b8324a';g.font='900 28px Nunito, sans-serif';g.textBaseline='middle';g.fillText(x.app,0,0);g.restore();

async function dl(){const b=$('#dlb');if(b)b.disabled=true;
  try{const c=await drawDiploma();const jb=await new Promise((r,j)=>c.toBlob(v=>v?r(v):j(new Error('jpeg')),'image/jpeg',.92));

    const d=window.claude&&claude.use?await claude.use('downloads'):null;
    if(d)await d.save({filename:fn,data:blob});
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove()}
  }catch(e){if(!(e&&e.code=='declined'))alert(t().pdfErr)}
